  # ---------------------------------------------------------------------
  # GDELT DOC 2.0
  # ---------------------------------------------------------------------
  - id: gdelt_doc_v2
    provider: GDELT Project
    region: GLOBAL
    language: multi (65 languages)
    tier: 1
    licence: free, public (GDELT terms of use; attribution requested, no redistribution restriction found)
    method: api
    endpoint_or_feed: "https://api.gdeltproject.org/api/v2/doc/doc"
    auth: none
    rate_limit: >
      Undocumented hard limit; docs say "one request every 5 seconds" but
      PROBED 2026-09-11 shows that is optimistic — 3 of 5 sequential queries
      spaced 6s apart (after ~12-15s of their own latency) still 429'd with
      "Please limit requests to one every 5 seconds". Effective safe cadence
      observed closer to >=15-20s between requests, or a longer backoff after
      any 429. news_intelligence.py's existing 1.0s stagger between its own
      three calls is UNDER this — matches its own 429-storm postmortem note
      (2026-07-16) and should be widened, not just staggered.
    pit_grade: first_seen_only
    stamp_field: seendate
    stamp_tz: "UTC, format YYYYMMDDTHHMMSSZ (e.g. 20260807T034500Z)"
    ticker_tags: false
    body_available: false
    notes: >
      Returns url/url_mobile/title/seendate/socialimage/domain/language/
      sourcecountry only — headline + URL, no body. seendate is GDELT's
      "when we saw it" (a crawl/index timestamp), not a guaranteed
      first-publish time, hence first_seen_only not native_stamp: write our
      own first_seen_utc at ingest alongside it. One query template per
      region: `sourcecountry:<FIPS>` (HK, CH=China, JA=Japan, KS=Korea are
      GDELT's FIPS codes, NOT ISO — CH is China, not Switzerland in this
      scheme). One query template per theme, reading names from
      backend/data/theme_baskets.yaml (5 themes found: ai_compute, energy_oil,
      batteries_minerals, quantum, pharma_biotech) — build an OR-of-tickers
      query per theme, e.g. `(NVDA OR AVGO OR AMD OR ...)`. mode=artlist,
      format=json, maxrecords<=250 per call. Rolling 3-month window only;
      NGrams 3.0 bulk is the documented fallback for older/higher-volume pulls.

