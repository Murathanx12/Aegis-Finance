# Lane N-B — source registry draft, in World Monitor's shape.
# Built 2026-09-11 by the lane-N data-acquisition probe (read-only on the repo;
# this file lives in the scratchpad, not backend/data/news_sources.yaml — the
# Opus builder in chunk 4 copies/adapts what it wants).
#
# Fields per source: id, provider, region, language, tier, licence, method,
# endpoint_or_feed, auth, rate_limit, pit_grade, stamp_field, stamp_tz,
# ticker_tags, body_available, notes.
#
# pit_grade legend (roadmap N-B / invariant 20):
#   native_stamp   — the provider's own first-publish timestamp is trustworthy
#                     and is never silently backfilled/edited (safe to LABEL).
#   first_seen_only — no trustworthy native stamp; only OUR OWN first_seen_utc
#                     (written at ingest) is safe to use as the PIT anchor.
#   index_state    — the feed reflects current index/search state, can be
#                     edited/reordered/backfilled after the fact by the
#                     provider; NEVER a label source (invariant 20), breadth
#                     only.

sources:

