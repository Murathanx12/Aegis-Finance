  # ---------------------------------------------------------------------
  # SEC EDGAR
  # ---------------------------------------------------------------------
  - id: sec_edgar_8k_current_atom
    provider: SEC EDGAR
    region: US
    language: en
    tier: 1
    licence: public domain (US government work)
    method: api
    endpoint_or_feed: >
      https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=include&count=40&output=atom
    auth: none
    rate_limit: "10 req/s per IP (SEC-wide guidance); compliant User-Agent header required (AppName contact@email)"
    pit_grade: native_stamp
    stamp_field: updated (Atom entry) / "Filed:" in the summary HTML
    stamp_tz: "US/Eastern (e.g. 2026-09-11T07:00:21-04:00)"
    ticker_tags: false
    body_available: false
    notes: >
      IMPORTANT CORRECTION vs the roadmap's phrasing "SEC EDGAR Atom (8-K
      current feed)": action=getcompany (no CIK) returns an EMPTY feed
      (probed: 0 entries) — that action requires a company name/CIK. The
      correct current-events feed is action=getcurrent (probed: 200, 40
      entries, e.g. EXELIXIS INC 8-K filed 2026-09-11 Item 8.01). Title
      carries "8-K - COMPANY NAME (CIK) (Filer)"; summary carries Filed date,
      AccNo, Size, and the Item numbers (e.g. "Item 2.02: Results of
      Operations...") — Item 2.02 is the N-E-adjacent earnings-announcement
      signal per research_patents_data.md. No ticker in the feed — CIK only;
      needs a CIK->symbol join (SEC's own company_tickers.json, not probed
      here, is the free join table). Entity id for N-D: CIK.

  # ---------------------------------------------------------------------
  # Nikkei Asia RSS
  # ---------------------------------------------------------------------
  - id: nikkei_asia_rss
    provider: Nikkei Asia
    region: JP
    language: en
    tier: 2
    licence: "publisher RSS terms — typically headline+link only, no redistribution of body"
    method: rss
    endpoint_or_feed: "https://asia.nikkei.com/rss/feed/nar"
    auth: none
    rate_limit: "none observed"
    pit_grade: index_state
    stamp_field: "dc:date (RDF/RSS 1.0 'date' element, NOT a plain <item><pubDate>)"
    stamp_tz: unverified (not present in the 10-row sample pulled; feed is RSS 1.0/RDF, not RSS 2.0)
    ticker_tags: false
    body_available: false
    notes: >
      CORRECTION: this is RSS 1.0 / RDF, not RSS 2.0 — items are
      <rdf:RDF><channel>...<item> elements namespaced under
      http://purl.org/rss/1.0/, NOT plain <item> children of <channel> as in
      RSS 2.0. A naive `root.findall(".//item")` (no namespace handling)
      returns ZERO matches, which is what happened on the first probe attempt
      before the parser was fixed. PROBED (fixed): 200, 50 items, e.g.
      "Chinese Nvidia challenger Enflame jumps 179% in Shanghai market debut"
      (asia.nikkei.com/business/markets/ipo/...). Pan-Asia coverage (China,
      HK, Vietnam, Japan all appeared in the 50-item sample), not JP-only —
      region tag above is a simplification.

