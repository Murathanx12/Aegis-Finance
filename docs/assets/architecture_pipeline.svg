ospace;letter-spacing:1px;fill:#ff8a1f}.rule{stroke:rgba(255,255,255,.18)}.sec{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:3px;fill:#fff}.foot{font:400 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:1.2px;fill:rgba(255,255,255,.45)}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
