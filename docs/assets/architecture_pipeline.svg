<text x="886" y="521" class="stt">FORECASTS</text>
<text x="830" y="558" class="sd">Frozen before the outcome exists,</text>
<text x="830" y="579" class="sd">graded at 1 / 5 / 21 / 63 sessions</text>
<line x1="830" y1="597" x2="1140" y2="597" stroke="rgba(255,255,255,.08)"/>
<text x="830" y="620" class="mod"><tspan class="dir">backend/services/</tspan><tspan class="file">belief_state.py</tspan></text>
