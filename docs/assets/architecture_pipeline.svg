<text class="s st" x="828" y="161">WORLD STATE / THEORY</text>
<text class="s ab" x="820" y="185">Persistent beliefs, scenarios, regime rows;</text>
<text class="s ab" x="820" y="202">a theory: mechanism, precursor, falsifier</text>
<path d="M820 215H1132" stroke="#2a3a55" stroke-width="1"/>
<text class="m mod" x="820" y="235"><tspan class="dir">backend/services/</tspan><tspan class="file">world_state.py</tspan></text>
<text class="m mod" x="820" y="254"><tspan class="dir">scripts/</tspan><tspan class="file">hyp_theory_cells.py</tspan></text>
</g>
<g id="stage-4">
<rect x="804" y="360" width="344" height="176" rx="12" fill="#111b2c" stroke="#2a3a55" stroke-width="1.2"/>
<circle cx="804" cy="387" r="13" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s num" x="804" y="392" text-anchor="middle">4</text>
<text class="s st" x="828" y="393">FORECASTS</text>
<text class="s ab" x="820" y="417">Frozen before the outcome exists; graded</text>
<text class="s ab" x="820" y="434">at h = 1 / 5 / 21 / 63 sessions</text>
<path d="M820 447H1132" stroke="#2a3a55" stroke-width="1"/>
<text class="m mod" x="820" y="467"><tspan class="dir">scripts/</tspan><tspan class="file">sim_run.py</tspan><tspan class="sym"> · u_forecast</tspan></text>
<text class="m mod" x="820" y="486"><tspan class="dir">backend/services/</tspan><tspan class="file">belief_state.py</tspan></text>
<text class="m mod" x="820" y="505"><tspan class="dir">nn_lab/</tspan><tspan class="file">nightly.py</tspan></text>
</g>
<g id="stage-5">
<rect x="420" y="360" width="344" height="176" rx="12" fill="#111b2c" stroke="#2a3a55" stroke-width="1.2"/>
<circle cx="420" cy="387" r="13" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5"/>
<text class="s num" x="420" y="392" text-anchor="middle">5</text>
<text class="s st" x="444" y="393">OPPORTUNITY / DECISION</text>
<text class="s ab" x="436" y="417">Direction and magnitude kept apart; risk</text>
<text class="s ab" x="436" y="434">priced on the names it would actually buy</text>
<path d="M436 447H748" stroke="#2a3a55" stroke-width="1"/>
<text class="m mod" x="436" y="467"><tspan class="dir">backend/services/</tspan><tspan class="file">opportunity_funnel.py</tspan></text>
<text class="m mod" x="436" y="486"><tspan class="dir">scripts/</tspan><tspan class="file">sim_run.py</tspan><tspan class="sym"> · u_rank</tspan><tspan class="sym"> · u_plan</tspan></text>
<text class="m mod" x="436" y="505"><tspan class="dir">backend/services/</tspan><tspan class="file">decision_contract.py</tspan></text>
<text class="m mod" x="436" y="524"><tspan class="dir">backend/services/</tspan><tspan class="file">opportunities.py</tspan></text>
</g>
<g id="stage-6">
<rect x="36" y="360" width="344" height="176" rx="12" fill="#111b2c" stroke="#2a3a55" stroke-width="1.2"/>
