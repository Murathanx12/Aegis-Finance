<text class="s num" x="420" y="160" text-anchor="middle">2</text>
<text class="s st" x="444" y="161">EVIDENCE</text>
<text class="s ab" x="436" y="185">A language model reads what was stored and</text>
<text class="s ab" x="436" y="202">proposes; deterministic code weighs it</text>
<path d="M436 215H748" stroke="#2a3a55" stroke-width="1"/>
<text class="m mod" x="436" y="235"><tspan class="dir">backend/services/</tspan><tspan class="file">world_digest.py</tspan></text>
<text class="m mod" x="436" y="254"><tspan class="dir">backend/services/</tspan><tspan class="file">analyst_reputation.py</tspan></text>
<text class="m mod" x="436" y="273"><tspan class="dir">backend/services/</tspan><tspan class="file">data_catalog.py</tspan></text>
</g>
<g id="stage-3">
<rect x="804" y="128" width="344" height="176" rx="12" fill="#111b2c" stroke="#2a3a55" stroke-width="1.2"/>
<circle cx="804" cy="155" r="13" fill="#0b1220" stroke="#38bdf8" stroke-width="1.5"/>
