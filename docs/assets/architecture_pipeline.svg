<text class="s st" x="60" y="625">OUTCOME</text>
<text class="s ab" x="52" y="649">A daily pass grades what came due and</text>
<text class="s ab" x="52" y="666">reports refusals instead of hiding them</text>
<path d="M52 679H364" stroke="#2a3a55" stroke-width="1"/>
<text class="m mod" x="52" y="699"><tspan class="dir">scripts/</tspan><tspan class="file">daily_pass.py</tspan></text>
<text class="m mod" x="52" y="718"><tspan class="dir">backend/services/</tspan><tspan class="file">forecast_grader.py</tspan></text>
<text class="m mod" x="52" y="737"><tspan class="dir">scripts/</tspan><tspan class="file">sim_run.py</tspan><tspan class="sym"> · u_grade</tspan></text>
