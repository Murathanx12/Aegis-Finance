<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">How Aegis works, module by module</title>
<desc id="desc">How Aegis works, module by module: 1 world sensors (Sensors in docs/AEGIS_V1_BETA_2026-10-07.md §2): scripts/news_pull.py, backend/services/web_reader.py, scripts/pull_analyst_targets.py, backend/services/public_flow_common.py; 2 evidence (Evidence in docs/AEGIS_V1_BETA_2026-10-07.md §2): backend/services/world_digest.py, backend/services/data_catalog.py, backend/services/analyst_reputation.py; 3 world state / theory (Evidence (world state beliefs) and the theory cells in docs/AEGIS_V1_BETA_2026-10-07.md §2): backend/services/world_state.py, scripts/hyp_theory_cells.py; 4 forecasts (Forecasts in docs/AEGIS_V1_BETA_2026-10-07.md §2): backend/services/belief_state.py, backend/services/forecast_ledger.py, scripts/sim_run.py · u_forecast, nn_lab/nightly.py; 5 decision (Decision in docs/AEGIS_V1_BETA_2026-10-07.md §2): backend/services/opportunity_funnel.py, backend/services/decision_contract.py, scripts/sim_run.py · u_rank · u_plan, backend/services/opportunities.py; 6 paper action (Paper execution (a HOLD is an action too) in docs/AEGIS_V1_BETA_2026-10-07.md §2): backend/services/sim_session.py, scripts/task_keeper.py · AegisSimOwner, backend/services/pc_broker.py; 7 outcome (Outcomes in docs/AEGIS_V1_BETA_2026-10-07.md §2): scripts/daily_pass.py, backend/services/forecast_grader.py, scripts/sim_run.py · u_grade; 8 attribution (Attribution (regret) in docs/AEGIS_V1_BETA_2026-10-07.md §2): backend/services/book_dna.py, backend/services/regret_ledger.py, backend/services/decision_story.py; 9 learning (Learning in docs/AEGIS_V1_BETA_2026-10-07.md §2): backend/services/policy_state.py, backend/services/hyp_lab.py, backend/services/expected_return.py. Learning feeds the next cycle: weights + preferences → next cycle; family posterior → next hypothesis round.</desc>
