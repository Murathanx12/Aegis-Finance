<text x="40" y="60" class="kicker">AEGIS FINANCE · THE LOOP, MODULE BY MODULE</text>
<text x="36" y="108" class="h1">HOW IT WORKS</text>
<text x="40" y="142" class="lede">Language models read the world and propose; deterministic code ranks, sizes, stops and exits. Paper only.</text>
<rect x="1070" y="40" width="90" height="26" fill="none" stroke="rgba(255,255,255,.3)"/>
<text x="1083" y="57" class="chip">9 STAGES</text>
