<text x="116" y="521" class="stt">PAPER ACTION</text>
<text x="60" y="558" class="sd">Paper only, and a HOLD is a decision.</text>
<text x="60" y="579" class="sd">No LLM has authority over real capital</text>
<line x1="60" y1="597" x2="370" y2="597" stroke="rgba(255,255,255,.08)"/>
<text x="60" y="620" class="mod"><tspan class="dir">backend/services/</tspan><tspan class="file">sim_session.py</tspan></text>
<text x="60" y="639" class="mod"><tspan class="dir">scripts/</tspan><tspan class="file">task_keeper.py</tspan><tspan class="sym"> · AegisSimOwner</tspan></text>
<text x="60" y="658" class="mod"><tspan class="dir">backend/services/</tspan><tspan class="file">pc_broker.py</tspan></text>
</g>
