<text x="501" y="255" class="stt">EVIDENCE</text>
<text x="445" y="292" class="sd">An LLM reads what was stored and</text>
<text x="445" y="313" class="sd">proposes; deterministic code weighs it</text>
<line x1="445" y1="331" x2="755" y2="331" stroke="rgba(255,255,255,.08)"/>
<text x="445" y="354" class="mod"><tspan class="dir">backend/services/</tspan><tspan class="file">world_digest.py</tspan></text>
