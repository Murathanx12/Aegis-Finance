<text class="s st" x="60" y="393">PAPER ACTION OR ABSTENTION</text>
<text class="s ab" x="52" y="417">Paper only, and a HOLD is a decision too;</text>
<text class="s ab" x="52" y="434">no LLM has authority over real capital</text>
<path d="M52 447H364" stroke="#2a3a55" stroke-width="1"/>
<text class="m mod" x="52" y="467"><tspan class="dir">scripts/</tspan><tspan class="file">task_keeper.py</tspan><tspan class="sym"> · AegisSimOwner</tspan></text>
<text class="m mod" x="52" y="486"><tspan class="dir">backend/services/</tspan><tspan class="file">sim_session.py</tspan></text>
<text class="m mod" x="52" y="505"><tspan class="dir">backend/services/</tspan><tspan class="file">pc_broker.py</tspan></text>
</g>
