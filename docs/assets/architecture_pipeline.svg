<path d="M36 784H1148" stroke="#2a3a55" stroke-width="1"/>
<text class="s ft" x="36" y="804">State on 2026-10-07 (docs/AEGIS_V1_BETA_2026-10-07.md §9): V1 Beta not reached; 1 of 11 acceptance clauses met, 7 partially, 3 not yet.</text>
<text class="s ft" x="36" y="823">Not yet closed: no live decision story exists (dry run only), and policy_state is written but not yet read by a plan (§2).</text>
<text class="s ft2" x="36" y="842">Solid arrows: one cycle. Dashed: what the next cycle inherits. Every path is repo-relative and checked by backend/tests/test_public_assets.py.</text>
</svg>
