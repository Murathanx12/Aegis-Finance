<text x="501" y="521" class="stt">DECISION</text>
<text x="445" y="558" class="sd">Direction and magnitude kept apart;</text>
<text x="445" y="579" class="sd">risk priced on what it would buy</text>
<line x1="445" y1="597" x2="755" y2="597" stroke="rgba(255,255,255,.08)"/>
<text x="445" y="620" class="mod"><tspan class="dir">backend/services/</tspan><tspan class="file">opportunity_funnel.py</tspan></text>
<text x="445" y="639" class="mod"><tspan class="dir">backend/services/</tspan><tspan class="file">decision_contract.py</tspan></text>
<text x="445" y="658" class="mod"><tspan class="dir">scripts/</tspan><tspan class="file">sim_run.py</tspan><tspan class="sym"> · u_rank</tspan><tspan class="sym"> · u_plan</tspan></text>
<text x="445" y="677" class="mod"><tspan class="dir">backend/services/</tspan><tspan class="file">opportunities.py</tspan></text>
</g>
