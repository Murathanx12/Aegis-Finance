<text x="886" y="255" class="stt">WORLD STATE / THEORY</text>
<text x="830" y="292" class="sd">Beliefs, scenarios, regimes; every</text>
<text x="830" y="313" class="sd">theory: mechanism, precursor, falsifier</text>
<line x1="830" y1="331" x2="1140" y2="331" stroke="rgba(255,255,255,.08)"/>
<text x="830" y="354" class="mod"><tspan class="dir">backend/services/</tspan><tspan class="file">world_state.py</tspan></text>
