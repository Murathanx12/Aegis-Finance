<title id="title">AEGIS Finance</title>
<desc id="desc">AEGIS Finance. Auditable AI investment intelligence. Aegis is an open-source investment research system that writes down what it believes before an outcome exists, grades every belief against what then happens, and lets only graded beliefs change how paper capital is sized. https://aegis-finance-six.vercel.app</desc>
