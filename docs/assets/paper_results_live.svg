<desc id="desc">Best paper accounts as of 2026-10-06 (receipt backend/data/optimus/paper_accounts/roi_2026-10-06T235345Z.json): revision_flow_v0 +7.14% vs SPY +1.40% over its own window, +5.74 pp, OBSERVED(7); night book b109c886 +6.08% vs SPY +2.19% over its own window, +3.90 pp, OBSERVED(17); hack2 +2.31% vs SPY +1.29% over its own window, +1.02 pp, OBSERVED(27). Best strategy account in each of 3 families (control twins excluded), picked after the fact from 307 priced paper accounts. Paper only; each return is over the account's own window, SPY compounded over the same days.</desc>
<style>.bg{fill:#000000}.sec{font:700 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:3px;fill:#fff}.secr{font:400 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:1.5px;fill:rgba(255,255,255,.45)}.rule{stroke:rgba(255,255,255,.14)}.live{fill:#4a8dff;animation:live 1.8s ease-out infinite}@keyframes live{0%{opacity:1}100%{opacity:.15}}.excess{font:300 34px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#6fb0ff}.exlab{font:500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:1.5px;fill:#4a8dff}.acct{font:600 15px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#fff}.meta{font:400 12px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:rgba(255,255,255,.58)}.badge{font:500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:1.5px;fill:rgba(255,255,255,.45)}.track{fill:rgba(255,255,255,.06)}.bar-acct{fill:#4a8dff}.bar-spy{fill:rgba(255,255,255,.55)}.val{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#fff}.valspy{font:400 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:rgba(255,255,255,.58)}.grid{stroke:rgba(255,255,255,.08)}.zero{stroke:rgba(255,255,255,.45);stroke-dasharray:2 3}.tick{font:400 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:rgba(255,255,255,.45)}.ln-acct{fill:none;stroke:#4a8dff;stroke-width:2.4;stroke-linejoin:round}.ln-spy{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:5 4}.ln-twin{fill:none;stroke:rgba(255,255,255,.45);stroke-width:1.4}.pt{fill:#000000;stroke:#4a8dff;stroke-width:1.6}.pulse{fill:none;stroke:#6fb0ff;stroke-width:1.5}.pulse-core{fill:#6fb0ff}.lab-acct{font:600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#6fb0ff}.lab-spy{font:400 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#fff}.lab-twin{font:400 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:rgba(255,255,255,.45)}.ctitle{font:600 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#fff}.fine{font:400 11px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:rgba(255,255,255,.45)}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
