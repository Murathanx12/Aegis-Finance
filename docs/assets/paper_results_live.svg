<desc id="desc">Best paper accounts as of 2026-10-09 (receipt docs/assets/public_results_2026-10-09T045359Z.json): revision_flow_v0 +6.97% vs SPY +0.73% over its own window, +6.24 pp, OBSERVED(9); night book b109c886 +4.03% vs SPY +1.51% over its own window, +2.52 pp, OBSERVED(19); hack2 +2.48% vs SPY +0.62% over its own window, +1.86 pp, OBSERVED(29). Best strategy account in each of 3 families (control twins excluded), picked after the fact from 307 priced paper accounts. Paper only; each return is over the account's own window, SPY compounded over the same days.</desc>
