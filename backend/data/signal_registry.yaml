# ═══════════════════════════════════════════════════════════════════════════
# SIGNAL REGISTRY — what the research lab permits the portfolio manager to use
# ═══════════════════════════════════════════════════════════════════════════
#
# Murat's correction, and the reason this file exists:
#
#   "research discovers what has evidence -> Optimus uses that evidence to
#    manage the portfolio -> shadow portfolios test alternative ways of using
#    it -> their outcomes create new research questions."
#
# Until now every one of those findings lived in prose: SIGNAL_TAXONOMY.md,
# thirty NIGHT verdicts, eighty-nine pre-registrations, a graveyard census of
# 148 rows. The PM could not read any of it, so it could neither obey a kill
# nor benefit from a survivor. This file is the machine-readable interface
# between the two halves.
#
# ── THE THREE RULES ────────────────────────────────────────────────────────
#
# 1. A CLOSED mechanism cannot quietly re-enter the PM. `allowed_in_pm: false`
#    is enforced in code (backend/services/signal_registry.py), not by memory.
#
# 2. A closed mechanism is closed AS THAT MECHANISM. "Raw 13F ownership level"
#    is dead; "a specialist filer initiating a concentrated position ahead of a
#    catalyst" is a different object and may be registered as a NEW hypothesis
#    with its own denominator. The distinction is `family` + `mechanism`, and
#    a new hypothesis must name the corpse it is NOT (`distinct_from`).
#
# 3. OBSERVATIONAL is a permitted status, not a failing grade. NIGHT-9's
#    mandate is explicit: research sets reliability WEIGHTS, it does not block
#    labelled observational information from reaching the PM. What research
#    forbids is an observational signal being *presented* as validated.
#
# ── EVIDENCE GRADES ────────────────────────────────────────────────────────
#   VALIDATED       survived pre-registered confirm on PIT data, net of costs
#   SUPPORTED       real effect, but spanned by a known factor or era-fragile
#   SHELF           real rank information, no net premium — combiner inventory
#   OBSERVATIONAL   used by the PM, never tested by this lab on real data
#   HYPOTHESIS      registered, not yet run
#   REJECTED        adjudicated and killed as this mechanism
#   PERVERSE        adjudicated and killed WITH THE SIGN AGAINST US
#
# ── PERMITTED ROLES ────────────────────────────────────────────────────────
#   PICKER              may choose which stock to hold
#   FILTER              may screen or condition a book; may not choose
#   VETO                may block a name; may never promote one
#   RISK_INPUT          feeds sizing/vol/correlation; never expected return
#   EXPECTATION_SENSOR  reads what the market already expects
#   CATALYST_SENSOR     locates a dated event; carries no direction
#   ALLOCATOR           macro exposure only; may never stock-pick
#   CLOSED              no role
#
# reliability_weight is a bounded MULTIPLIER on a signal's contribution, in
# [0, 1]. It is never an amplifier and never exceeds 1.0. `null` means
# UNCALIBRATED — the PM must treat it as UNKNOWN (0.5), never as 1.0. That was
# a real BUILD-1.1 bug: unknown scored as perfect.

schema: signal-registry-v1
written: 2026-08-11
source_of_truth: >
  Aegis module: docs/SIGNAL_TAXONOMY.md (v1, 2026-07-25, 146-candidate map),
  docs/NIGHT{3,5,6,7,8,9}_VERDICT_*.md, docs/PF{1,2,4}_*_VERDICT_*.md,
  docs/GRAVEYARD_CENSUS_2026-08-09.md, TRIALS/registry.jsonl (89 rows),
  docs/CORRIGENDUM_OSAP_SIGNS_2026-08-08.md, docs/RETRACTION_NIGHT3_5_2.md.
standing_constraints:
  - id: NIGHT-9-RANK-IC
    rule: >
      rank-IC may describe ORDERING only. It may not corroborate a null money
      result, and "orders better" may not be claimed without a magnitude test
      beside it. A long-only book is paid in SIMPLE returns; a rank correlation
      is invariant to the log/simple relabelling that decides the money.
  - id: CANON-15
    rule: >
      A signal that ranks first on a frictionless panel is not thereby a
      trading rule. The trailing stop ranked first and lost 3.08%/yr under G7.
  - id: CANON-16
    rule: A cost comparison needs a denominator that is not the winner's.
  - id: CANON-17
    rule: An execution number carries the model that produced it.
  - id: PM-MANDATE
    rule: >
      The LLM never sizes. The engine never trades. Every wealth-target screen
      prints the ruin probability beside the dream number.

