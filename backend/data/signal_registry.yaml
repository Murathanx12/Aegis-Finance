  - signal_id: options_ranking_raw
    family: options
    mechanism: Rank the cross-section by an options-surface statistic.
    research_status: CLOSED
    evidence_grade: REJECTED
    permitted_role: CLOSED
    allowed_in_pm: false
    reliability_weight: 0.0
    horizon: 1-3mo
    universe: optionable US equity
    data_grade: >
      OptionMetrics standardised volatility surface. CACHED EXTRACT is
      month-end by our own WHERE clause; ENTITLED SOURCE `optionm.vsurfd<year>`
      is DAILY and read entitlement is proven by 23/23 successful year pulls.
      On disk `Aegis module/data/wrds_raw/optionm_vsurf_me/`, 23 parquet files,
      191.7 MB, 2002-2024, manifest 2026-08-01T12:27:44Z, CRSP link present.
    implementation_notes: >
      CORRECTION 2026-08-16. This entry read "OptionMetrics entitlement was
      never established" until today. That was FALSE, and had been false since
      the data landed on 2026-08-01. Entitlement and acquisition were never the
      blocker. A false blocker in a registry is worse than no entry at all: it
      stops work silently and indefinitely, and nothing ever re-checks it.
      What remains true is a SCOPE limit, not an access limit.

      SAMPLING, MEASURED rather than inferred from row counts
      (`scripts/optionm_schema_audit.py`). `vsurf_me` is MONTH-END: exactly 12
      observation dates per year, median gap 31 days, first 2002-01-31, last
      2024-12-31. Each (secid, date) carries a COMPLETE 8-point rectangular
      surface — days in {30, 91} x delta in {+/-25, +/-50} x cp in {C, P} — so
      96 rows/secid-year is 12 dates x 8 coordinates, NOT 96 observations.
      Implied-vol nulls 4.4%-6.5%. Securities grow 2,588 (2002) -> 6,044 (2024).
      The earlier "~87 rows/secid-year means it is not daily" reached the right
      conclusion by the wrong route: row count cannot identify sampling
      frequency when each date carries many surface coordinates.

      SECOND CORRECTION, SAME DAY. The paragraph above measures the CACHE and
      the paragraph it replaced concluded a property of the DATA from it. Those
      are different things and the first version got it wrong: it concluded
      that monthly resolution barred this from the daily ladder and gave it a
      monthly ladder of its own. That conclusion is FALSE and is withdrawn.

      The month-end sampling is a WHERE CLAUSE WE WROTE. From
      `Aegis module/scripts/fetch_wrds_optionm.py:128`:

        from optionm.vsurfd{yr}
        where days in (30, 91) and delta in (25, 50, -25, -50)
          and date in (select max(date) from optionm.vsurfd{yr}
                       group by date_trunc('month', date))

      The source table is `optionm.vsurfd<year>` — the DAILY standardised
      surface — and the month-end restriction, the two maturities and the four
      deltas are all our own filters. Read entitlement to the daily table is
      PROVEN, not assumed: 23/23 years pulled from it with zero errors
      (`manifest_optionm.json`, 2026-08-01).

      So the correct statement is: the CACHED EXTRACT is month-end; the
      ENTITLED SOURCE is daily. A daily implied-vol rung can be built on the
      same decision dates and folds as the realised-vol ladder, which is a far
      better comparison than a separate monthly one. Re-pulling scoped to a
      trial universe rather than all ~6,000 secids makes the cost negligible;
      it was ~550k rows/year at month-end for the whole cross-section.

      What survives from the first correction: coverage ends 2024 and updates
      annually, so this can never serve a LIVE lane whatever its frequency, and
      30d/91d map onto the 20d/60d horizons N4B/N9 already use.
      PIT caveat NOT cleared — max date never exceeds the file year, which
      rules out cross-year restatement in the extraction but says nothing about
      vintage restatement within a year. Verify before any live claim.
    known_effect: None established.
    known_failure: >
      Closed as a PICKER family (ranking the cross-section by a surface
      statistic). The expectation-sensor role is separate and open — see
      `options_expectation_sensor`. Closing the picker never closed the rung.
    receipts: ["Aegis module aegis_brain/factory/optsurf.py",
               "Aegis module/data/wrds_raw/optionm_vsurf_me/ (23 files, 191.7 MB)",
               "manifest_optionm.json 2026-08-01T12:27:44Z"]
    last_updated: 2026-08-16

