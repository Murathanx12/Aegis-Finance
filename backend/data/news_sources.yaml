# ---------------------------------------------------------------------------
# N-B — THE SOURCE REGISTRY for lane N (whole-market news, no LLM in the pull).
#
# Roadmap 2026-09-11 §3 N-B: "a source not in the registry cannot be pulled
# (refusal at parse)". `backend/services/news_registry.py` loads and validates
# this file; `scripts/news_pull.py` refuses any `--source` id that is not here,
# and `GET /api/control/coverage` reads it for the board's coverage card.
#
# Built from the 2026-09-11 lane-N probe
# (`docs/research_notes/2026-09-11/lane_n/REPORT.md` + its `news_sources.yaml`
# draft), WITH the five corrections that probe filed against the roadmap:
#
#   1. SEC EDGAR's current-filings feed is `action=getcurrent`. The obvious
#      guess `action=getcompany` (no CIK) returns an EMPTY feed — 0 entries,
#      200 OK. That is exactly the failure the "two zero runs is RED" rule
#      exists to catch, and it would have been mis-read as a dead feed.
#   2. GDELT's documented "one request per 5 s" is optimistic: the probe 429'd
#      3 of 5 queries at 6 s spacing. `min_interval_s: 20` below, not 5.
#   3. Nikkei Asia's feed is RSS 1.0 / RDF, not RSS 2.0. A namespace-naive
#      `findall(".//item")` returns ZERO items — again indistinguishable from a
#      dead source unless the parser is named. Hence `parser: rss1_rdf`.
#   4. AKShare has NO HK news function (24 `stock_hk_*` exports, none a news
#      feed). The draft's `akshare_hk_news` row is deliberately NOT carried
#      here: a registry row for a function that does not exist is a promise the
#      writer cannot keep.
#   5. The ADR name table's four fixes (LPL = LG Display not LG Corp;
#      MRAAY = Murata not Mitsubishi; MUFG=8306.T / MFG=8411.T; CAJ delisted)
#      live in `backend/data/news_entities/asia_adrs.csv`, not here.
#
# FIELDS (all required on every source; `news_registry` refuses a row missing
# any of them, which is how a half-added source fails loudly):
#   id                 unique; the `--source` argument
#   provider           who serves it
#   region             US | EU | HK | CN | JP | KR | SG | IN | GLOBAL
#   language           en | zh | ja | ko | multi
#   tier               1 | 2 | 3 | social_hypothesis
#   licence            what we are allowed to do with it
#   method             api | rss | lib
#   parser             which parser in scripts/news_pull.py reads it, or `none`
#   endpoint_or_feed   the URL or the call
#   auth               "none", or "key:ENV_NAME + key:ENV_NAME" — NAMES ONLY,
#                      never a value; receipts print the source name, not a key
#   rate_limit         prose, for a human
#   min_interval_s     seconds the writer sleeps between calls to this source
#   pit_grade          native_stamp | first_seen_only | index_state
#   stamp_field        the provider's own timestamp field, or "none"
#   stamp_tz           its timezone
#   ticker_tags        does the provider tag symbols itself
#   body_available     is there a body, or only a headline
#   label_source       may a return EVER be labelled from this source's rows
#   implemented        can `scripts/news_pull.py` pull it TODAY
#   implemented_note   if not, why — so "0 rows" is never a mystery
#   notes              everything else
#
# pit_grade legend (invariant 20):
#   native_stamp    the provider's own first-publish stamp is trustworthy and
#                   is not silently backfilled — safe to LABEL from.
#   first_seen_only no trustworthy provider stamp; OUR OWN `first_seen_utc`,
#                   written at write time, is the only safe PIT anchor. Still
#                   labellable, because we wrote the anchor ourselves.
#   index_state     the feed reflects CURRENT index/search state and can be
#                   reordered, edited or backfilled by the provider after the
#                   fact. NEVER a label source. Breadth and coverage only.
#
# THE HARD RULE, enforced in `news_registry.validate()` and pinned by test:
#   pit_grade == index_state  =>  label_source MUST be false.
#
# OMITTED ON PURPOSE (asked for, no free machine-readable feed found):
#   * Composer symphony pages — the public marketplace is a rendered web app;
#     no public JSON or RSS endpoint was found in the 09-11 research pass.
#   * QuantConnect verified live strategies — same; the listing is behind the
#     app, not an API.
#   * AltIndex's composite alt-data list — a vendor page, not a feed.
#   Each would be a scraper, not a source, and a scraper belongs in a lane with
#   its own receipt. They are listed here so the next reader knows they were
#   considered and why they are absent.
# ---------------------------------------------------------------------------

version: "news_sources_v1/2026-09-11"
licence: PRODUCT_EXPERIMENT

sources:

  # =====================================================================
  # TIER 1 — native stamp, or our own first-seen anchor. These may label.
  # =====================================================================

  - id: alpaca_benzinga_news
    provider: Alpaca (Benzinga-sourced)
    region: GLOBAL
    language: en
    tier: 1
    licence: Alpaca Market Data Agreement (bundled with the brokerage account; Benzinga content)
    method: api
    parser: alpaca_news
    endpoint_or_feed: "https://data.alpaca.markets/v1beta1/news"
    auth: "key:APCA_API_KEY_ID + key:APCA_API_SECRET_KEY (fallback: the terminal repo's .env AAT_HACK*_KEY_ID / _SECRET_KEY, data endpoint only)"
    rate_limit: "200 req/min free tier"
    min_interval_s: 0.4
    pit_grade: native_stamp
    stamp_field: created_at
    stamp_tz: "UTC (ISO 8601, Z-suffixed)"
    ticker_tags: true
    body_available: true
    label_source: true
    implemented: true
    implemented_note: >
      Pullable only when a key RESOLVES. Neither APCA_API_KEY_ID nor
      APCA_API_SECRET_KEY exists in this environment, so the writer REFUSES
      this source BY NAME (it does not crash, and it does not silently write
      zero rows — the receipt carries `failures: ["no credential ..."]` and the
      source is not counted as a zero-row run).
    notes: >
      The only source in this registry that is simultaneously native-stamp,
      ticker-tagged AND body-bearing, which is why N-A orders it first. History
      to 2015, ~130 articles/day. Cursor: `created_at`, incremental — the 83.6%
      backfill stalled in an earlier session precisely because there was no
      cursor file.

  - id: gdelt_doc_v2
    provider: GDELT Project
    region: GLOBAL
    language: multi
    tier: 1
    licence: "free, public (GDELT terms of use; attribution requested)"
    method: api
    parser: gdelt_doc
    endpoint_or_feed: "https://api.gdeltproject.org/api/v2/doc/doc"
    auth: none
    rate_limit: >
      Documented "one request every 5 s"; PROBED 2026-09-11 to be optimistic —
      3 of 5 queries spaced 6 s apart still 429'd. `min_interval_s: 20` is the
      empirically observed safe cadence, not the documented one. On a 429 the
      writer backs off (doubling from the interval) and records the failure;
      the documented bulk fallback is NGrams 3.0, which is NOT implemented here
      and is named in the receipt when the paced path exhausts.
    min_interval_s: 20
    pit_grade: first_seen_only
    stamp_field: seendate
    stamp_tz: "UTC, YYYYMMDDTHHMMSSZ"
    ticker_tags: false
    body_available: false
    label_source: true
    implemented: true
    implemented_note: ""
    queries:
      - "sourcecountry:HK"
      - "sourcecountry:CH"
      - "sourcecountry:JA"
      - "sourcecountry:KS"
      - "sourcecountry:SN"
      - "sourcecountry:IN"
    notes: >
      `seendate` is GDELT's crawl/index time, not a publisher's first-publish
      stamp — hence first_seen_only, and we write our own `first_seen_utc`
      beside it. FIPS country codes, NOT ISO: CH is China (not Switzerland), JA
      Japan, KS South Korea, SN Singapore, HK Hong Kong, IN India. mode=artlist,
      format=json, maxrecords<=250. Rolling 3-month window only. Headline + URL,
      no body, no tickers — entity resolution (N-D) supplies the symbols or the
      row keeps `tickers: []` and is counted unresolved.

  - id: sec_edgar_8k_current_atom
    provider: SEC EDGAR
    region: US
    language: en
    tier: 1
    licence: "public domain (US government work)"
    method: api
    parser: edgar_atom
    endpoint_or_feed: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=include&count=100&output=atom"
    auth: none
    rate_limit: "10 req/s per IP, SEC-wide; a descriptive User-Agent header with a contact address is REQUIRED"
    min_interval_s: 1.0
    pit_grade: native_stamp
    stamp_field: updated
    stamp_tz: "US/Eastern (filing acceptance time)"
    ticker_tags: false
    body_available: false
    label_source: true
    implemented: true
    implemented_note: ""
    notes: >
      CORRECTION vs the roadmap's phrasing: `action=getcompany` with no CIK
      returns an EMPTY feed; `action=getcurrent` is the current-events feed.
      Title is "8-K - COMPANY NAME (CIK) (Filer)"; summary carries the Filed
      date, AccNo, Size and the Item numbers. Item 2.02 (Results of Operations)
      is tagged `entity_tags: ["8-K:2.02"]` by the writer — a free,
      vendor-independent earnings-announcement PIT marker. `raw_id` is the
      accession number. No ticker in the feed; the company name goes through
      N-D's resolver and the CIK is kept in `entity_tags` as `cik:NNNNNNN`.

