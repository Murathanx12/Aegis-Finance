    stamp_field: "content.pubDate"
    stamp_tz: "UTC (ISO 8601 Z-suffixed)"
    ticker_tags: true
    body_available: true
    label_source: true
    implemented: true
    implemented_note: ""
    notes: >
      10 items per call is a fixed page size, not a day's volume — this is a
