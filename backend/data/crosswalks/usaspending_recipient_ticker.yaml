# Recipient / lobbying-client name -> ticker crosswalk (chunk C16, 2026-10-07; dated after review F7).
#
# HAND-CURATED, first pass ("explore dirty"): the largest public federal
# contractors by federal dollars, across defence primes, IT services, health,
# energy and aerospace. No free UEI -> ticker crosswalk exists (every one found
# is a paid product; docs/research_notes/2026-10-07/public_flow_sensors_2026-10-07.md section 1).
# A fuzzy EDGAR-name join is a LATER stretch, not this file.
#
# Fields
#   ticker                 the listed symbol TODAY of the company that owned the recipient on the event date.
#                          A predecessor that is the SAME company (a rename: Harris -> L3Harris, Anthem ->
#                          Elevance, SAIC -> Leidos 2013, UTX -> RTX) maps to today's ticker; a company that
#                          was a SEPARATE listing before an acquisition (Raytheon Company before 2020-04,
#                          Rockwell Collins before 2018-11, Aerojet before 2023-07) is dated out.
#   valid_from / valid_to  the entry maps only events dated inside [valid_from, valid_to] (inclusive; empty =
#                          open). Matching uses the event's own date (USAspending action date, LDA period end).
#   company, sector        display
#   recipient_patterns     USAspending `Recipient Name` prefixes (normalised: upper case, & -> AND,
#                          punctuation dropped). A name matches a pattern when it equals it or starts
#                          with it followed by a space; the LONGEST matching pattern wins; two tickers
#                          tied on the longest pattern = AMBIGUOUS (never guessed); two entries of the SAME
#                          ticker tied = the LOWER confidence binds.
#   lda_client_patterns    Senate LDA `client.name` prefixes, same rule.
#   uei                    Recipient UEIs SEEN in a live pull (filled from receipts, never invented). A UEI
#                          match is used only for events on or after 2022-04-04 (the UEI era) and only when
#                          the entry is valid on the event date.
#   confidence             high   = distinctive name, the listed parent has owned the recipient throughout
#                          medium = an acquired unit, a renamed predecessor, a name a subsidiary / JV /
#                                   unrelated firm can share, or a recent spin-off changed the owner
#                          low    = an M&O / joint-venture contractor: the dollars fund a national lab or a
#                                   JV and are NOT the parent's own revenue
#   note                   why the confidence is not high
#
# Excluded on purpose (private or foreign-only): Bechtel, General Atomics, SpaceX, Blue Origin,
# Deloitte, ManTech (Carlyle 2022), Maxar (Advent 2023), Triad National Security.
# Identity attributes of any person or group are NEVER a field here (roadmap 2026-10-06 section 2 item 10).

