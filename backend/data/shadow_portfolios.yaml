# Forward shadow register — champion and challengers
# ═══════════════════════════════════════════════════════════════════════════
#
# NOTHING HERE IS A WINNER, AND NOTHING HERE EVER CLEARED THE BAR.
#
# ARENA-1 was a null: 384 genomes, 66 survived the pre-declared selection rule,
# and Bonferroni over 384 gives p_adj = 1.000.
#
# This file previously said that 2 genomes "cleared the false-discovery bar
# (+4.87 %/yr)". Both halves of that sentence were wrong, and they were wrong
# together. +4.87 was never the bar: it is the real-data equal-weight CONTROL
# genome — the same measurement separately published as "ranked 4th of 384" —
# quoted a second time as though it were a threshold. The bar is the MAXIMUM of
# 384 draws when nothing predicts anything, which is a sample from an
# extreme-value distribution and cannot be read off one draw.
#
# Measured over 60 null worlds through the same generator, pool and scorer
# (`runs/ARENA1/null_bar.json`, Aegis module):
#
#     best-of-384 under the null   0.83 -> 7.68 %/yr   (mean 3.72, sd 1.79)
#     operating bar, 95th pctile   +6.90 %/yr
#
# Against that bar **0 of 384 genomes clear**, including the best genome in the
# whole pool (G0245, +6.06 %/yr). The two entries below once described as
# "above the bar at t ~ 1.2" were above a number that was never the bar.
#
# The corrected reading is not weaker than the published one. It is the same
# conclusion stated exactly: the Arena found nothing.
#
# The bar is specific to a pool of 384. An extreme-value threshold scales with
# how many chances were taken, so a successor arena recomputes its own; it may
# not inherit this one.
#
# These books exist for the only reason a forward record is worth keeping:
# every genome in the Arena has already seen all 252 months of history, so a
# rank there is a hypothesis. Forward outcomes are the one kind of evidence
# nothing in this system has looked at yet.
#
# Rules that apply to every entry:
#   * no lane, no paper_nav, no flag, no capital, no order path
#   * one entry per MECHANISM FAMILY, not per genome — a register with three
#     hundred entries guarantees one of them looks brilliant in a year
#   * inception is the day it is seeded, at that day's prices; no history is
#     reconstructed backwards
#   * no skill claim before 24 months, matching the lane discipline
#
# `arena_rank` and `arena_excess` are IN-SAMPLE screen numbers, recorded so
# that the forward result can be compared against what was expected. They are
# not evidence and they are not a forecast.

schema: shadow-v1
seeded: 2026-08-11
arena: ARENA-1
arena_manifest_sha256: f7f7e7ef7457be50

# Measured, not quoted. See runs/ARENA1/null_bar.json in the Aegis module.
false_discovery_bar_pct_yr: 6.90
false_discovery_bar_basis: >
  95th percentile of the best-of-384 excess CAGR across 60 null worlds, same
  generator/pool/scorer as ARENA-1. Range across worlds 0.83 to 7.68 %/yr.
  Pool-size-specific: a different pool size needs its own bar.
false_discovery_bar_receipt: aegis-module:runs/ARENA1/null_bar.json
genomes_clearing_the_bar: 0
superseded_bar_pct_yr: 4.87
superseded_bar_note: >
  The retired 4.87 was the real-data equal-weight CONTROL genome (G0004), also
  published as "4th of 384" — one measurement counted twice, once as a result
  and once as the threshold it was supposed to be judged against.
inception_note: >
  Not yet seeded with positions. Seeding is attended: it needs a decision from
  Murat about whether these run on the funnel's live universe or on the panel
  proxies, and that decision changes what the record means.

books:

  - shadow_id: CHAMPION_OPTIMUS
    represents: the PM as it actually runs today
    genome: null
    mechanism: >
      Analyst-haircut expected return as a RISK_INPUT for sizing, over a book
      chosen by Murat's own thesis. This is not an Arena genome; it is the
      product, entered so the product has a forward record of its own.
    evidence_grade: OBSERVATIONAL
    arena_rank: null
    arena_excess: null
    why_here: >
      Everything else in this register is a research artifact. This is the one
      whose outcome Murat actually experiences, and without it the register
      would grade the alternatives against nothing he can feel.

  - shadow_id: CHALLENGER_QUALITY_LOWVOL
    represents: profitability x low-volatility, the Arena's rule-survivor
    genome: G0231
    mechanism: >
      profitability_small as the picker, low_volatility as a conditioning
      filter, 15 names, fractional-Kelly weights, 6-month clock.
    evidence_grade: SUPPORTED (the picker) / SCREEN ONLY (this combination)
    arena_rank: 2
    arena_excess: 5.06
    cleared_false_discovery_bar: false
    why_here: >
      Ranked 2nd of 384 in-sample at t 1.19, and BELOW the measured
      false-discovery bar of +6.90 %/yr — 5.06 is well inside the range a pool
      of 384 reaches on noise alone. It is here as a screen candidate, not as a
      finding. Forward is the only place that gets settled.

  - shadow_id: CHALLENGER_QUALITY_LOWVOL_LARGE
    represents: the same mechanism in the other segment
    genome: G0236
    mechanism: >
      Same pair, largemid, 10 names, inverse-vol, annual clock.
    evidence_grade: SCREEN ONLY
    arena_rank: 3
    arena_excess: 4.88
    cleared_false_discovery_bar: false
    why_here: >
      A second segment for the same mechanism, also below the +6.90 %/yr bar.
      If the mechanism is real both should drift positive together; if it is
      noise they will not. Note that this is one point of separation from the
      random control (4.87) — which is the sharpest available statement of how
      little the in-sample ranking distinguishes them.

  - shadow_id: CHALLENGER_EXCLUDED_G0245
    represents: the genome the frozen rule refused
    genome: G0245
    mechanism: >
      profitability_small x short_interest_level, 50 names, inverse-vol,
      monthly. Highest excess in the whole pool (+6.06 %/yr), the only genome
      with t above 2 (2.69), and 7 of 7 regime blocks won.
    evidence_grade: EXCLUDED BY THE PRE-DECLARED RULE
    arena_rank: 1
    arena_excess: 6.06
    cleared_false_discovery_bar: false
    excluded_because: >
      turnover 3.03 against a frozen gate of 3.00 — a 1 % overshoot on one axis
      disqualifying the best-looking result in the search.
    why_here: >
      Precisely BECAUSE it was excluded. If it is quietly right, the forward
      record will say so and the exclusion becomes a documented cost of the
      rule rather than an invisible one. It may not be promoted on this
      record; a rule that bends once is not a rule.

  - shadow_id: CONTROL_RANDOM
    represents: the null, running forward
    genome: G0004
    mechanism: >
      Names chosen by a deterministic pseudo-random score. 10 names,
      inverse-vol, annual clock.
    evidence_grade: CONTROL
    arena_rank: 4
    arena_excess: 4.87
    cleared_false_discovery_bar: false
    why_here: >
      It ranked FOURTH of 384 in-sample while picking names at random. Every
      challenger above is being measured against it forward, in real time —
      the comparison that would have caught most of what this programme has
      killed, years earlier.

      Its +4.87 is also the number this file once printed as the
      false-discovery bar. A control book's own result was doing duty as the
      threshold the challengers were judged against, which is why two of them
      appeared to clear it.
