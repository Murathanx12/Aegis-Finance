# Forward shadow register — champion and challengers
# ═══════════════════════════════════════════════════════════════════════════
#
# NOTHING HERE IS A WINNER. ARENA-1 was a null: 384 genomes, 66 survived the
# pre-declared selection rule, 2 cleared the false-discovery bar (+4.87 %/yr,
# the best of 384 when nothing predicts anything), both at t ~ 1.2, and
# Bonferroni over 384 gives p_adj = 1.000.
#
# These books exist for the only reason a forward record is worth keeping:
# every genome in the Arena has already seen all 252 months of history, so a
# rank there is a hypothesis. Forward outcomes are the one kind of evidence
# nothing in this system has looked at yet.
#
# Rules that apply to every entry:
#   * no lane, no paper_nav, no flag, no capital, no order path
#   * one entry per MECHANISM FAMILY, not per genome — a register with three
#     hundred entries guarantees one of them looks brilliant in a year
#   * inception is the day it is seeded, at that day's prices; no history is
#     reconstructed backwards
#   * no skill claim before 24 months, matching the lane discipline
#
# `arena_rank` and `arena_excess` are IN-SAMPLE screen numbers, recorded so
# that the forward result can be compared against what was expected. They are
# not evidence and they are not a forecast.

schema: shadow-v1
seeded: 2026-08-11
arena: ARENA-1
arena_manifest_sha256: f7f7e7ef7457be50
false_discovery_bar_pct_yr: 4.87
inception_note: >
  Not yet seeded with positions. Seeding is attended: it needs a decision from
  Murat about whether these run on the funnel's live universe or on the panel
  proxies, and that decision changes what the record means.

books:

  - shadow_id: CHAMPION_OPTIMUS
    represents: the PM as it actually runs today
    genome: null
    mechanism: >
      Analyst-haircut expected return as a RISK_INPUT for sizing, over a book
      chosen by Murat's own thesis. This is not an Arena genome; it is the
      product, entered so the product has a forward record of its own.
    evidence_grade: OBSERVATIONAL
    arena_rank: null
    arena_excess: null
    why_here: >
      Everything else in this register is a research artifact. This is the one
      whose outcome Murat actually experiences, and without it the register
      would grade the alternatives against nothing he can feel.

  - shadow_id: CHALLENGER_QUALITY_LOWVOL
    represents: profitability x low-volatility, the Arena's rule-survivor
    genome: G0231
    mechanism: >
      profitability_small as the picker, low_volatility as a conditioning
      filter, 15 names, fractional-Kelly weights, 6-month clock.
    evidence_grade: SUPPORTED (the picker) / SCREEN ONLY (this combination)
    arena_rank: 2
    arena_excess: 5.06
    why_here: >
      One of only two genomes above the false-discovery bar, at t 1.19 — which
      is to say, barely distinguishable from the luckiest of 384 noise draws.
      Forward is the only place that gets settled.

  - shadow_id: CHALLENGER_QUALITY_LOWVOL_LARGE
    represents: the same mechanism in the other segment
    genome: G0236
    mechanism: >
      Same pair, largemid, 10 names, inverse-vol, annual clock.
    evidence_grade: SCREEN ONLY
    arena_rank: 3
    arena_excess: 4.88
    why_here: >
      A second segment for the same mechanism. If the mechanism is real both
      should drift positive together; if it is noise they will not.

  - shadow_id: CHALLENGER_EXCLUDED_G0245
    represents: the genome the frozen rule refused
    genome: G0245
    mechanism: >
      profitability_small x short_interest_level, 50 names, inverse-vol,
      monthly. Highest excess in the whole pool (+6.06 %/yr), the only genome
      with t above 2 (2.69), and 7 of 7 regime blocks won.
    evidence_grade: EXCLUDED BY THE PRE-DECLARED RULE
    arena_rank: 1
    arena_excess: 6.06
    excluded_because: >
      turnover 3.03 against a frozen gate of 3.00 — a 1 % overshoot on one axis
      disqualifying the best-looking result in the search.
    why_here: >
      Precisely BECAUSE it was excluded. If it is quietly right, the forward
      record will say so and the exclusion becomes a documented cost of the
      rule rather than an invisible one. It may not be promoted on this
      record; a rule that bends once is not a rule.

  - shadow_id: CONTROL_RANDOM
    represents: the null, running forward
    genome: G0004
    mechanism: >
      Names chosen by a deterministic pseudo-random score. 10 names,
      inverse-vol, annual clock.
    evidence_grade: CONTROL
    arena_rank: 4
    arena_excess: 4.87
    why_here: >
      It ranked FOURTH of 384 in-sample. Every challenger above is being
      measured against a book that picks at random, forward, in real time —
      which is the comparison that would have caught most of what this
      programme has killed, years earlier.
