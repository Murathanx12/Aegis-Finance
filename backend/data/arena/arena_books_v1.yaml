# ARENA — Generation-1 product-experiment books (ORDER 25, adopted 2026-08-20)
#
# READ THIS BEFORE EDITING
# ========================
# * Every book here is a PRODUCT_EXPERIMENT SIMULATION. It is forward paper in
#   its own namespace (`<OPTIMUS_LEDGER_DIR>/arena/`). It NEVER writes
#   `paper_nav`, never touches a lane YAML, never enters the order path, and
#   nothing it produces may be cited as evidence of skill by any verdict,
#   research document, or product surface. (Same sentence copy_lab carries.)
# * The SHA-256 of this file's raw bytes is segment identity for every book in
#   it. An edit to ANY book is a config change for ALL of them: a changed book
#   is a NEW book id (`_v2`) in a NEW file version, never an in-place edit.
#   Books are seeded against this hash and refuse to run under a different one.
# * Books are the CHALLENGER tier of the 2026-08-19 quarterly-generations
#   decision: challengers live here (next-day, unlimited, SIMULATION);
#   promotion to a real lane happens only at a generation window through
#   `seed-a-lane` (pre-registered, env-gated, Murat flips the flag).
# * Rules transported from referee-verified findings cite their trial. Rules
#   that are NOT verified (LLM perception) are here precisely to MEASURE their
#   marginal value against the control twin — that is what the arena is for.
#
# Factorial shape: ENGINE_BASELINE_v1 is the control twin; each book differs
# from it by EXACTLY ONE rule, except CURRENT_BEST_v1 which is the composition.

schema: arena-v1
namespace: arena
label: SHADOW_BOOK
validation_status: PRODUCT_EXPERIMENT

defaults:
  notional_usd: 100000.0
  benchmark: SPY
  secondary_benchmark: QQQ
  transaction_cost_bps: 5      # one-way, the live-lane standard
  slippage_bps: 1
  select_top_k: 12
  rebalance: monthly_calendar  # selection refresh on the first session of month
  execution: next_session_open # decisions freeze after close; fills at next open
  max_single_name: 0.15
  min_price: 5.0
  # Every score in the day state is a z-score over the names that got priced.
  # If a fetch returns 20 of 180 names, the ranking is over a DIFFERENT
  # universe wearing the same name — and snapshots are write-once, so that
  # would be permanent. Below this share, books hold and say
  # `degraded_information_state`; they still mark NAV.
  min_priced_fraction: 0.80
  # DISCOVERY (stage A). The N most liquid CRSP-eligible names, scanned daily
  # by the trackers so a ticker the watchlist never contained can be nominated
  # into the candidate set. Tracker output is CONTEXT and DISCOVERY only — it
  # never enters arena_composite, because short-horizon winner-chasing is a
  # Holm-surviving ANTI-signal and because price features are near-copies of
  # the momentum already in the score (FEATURE_COVERAGE_AUDIT_1 §3b).
  # 0 disables discovery: the arena shipped that way.
  scan_universe_n: 400
  # The arena's OWN composite over the arena's OWN universe: 12-1 momentum
  # (last month EXCLUDED — the anti-chase findings) blended with whatever PIT
  # score families a name has (multifactor/revisions/insider/pead/quality on
  # the book cross-section). Weights in discovery.COMPOSITE_WEIGHTS. The
  # registered collectors' cross-sections are NOT widened — that would change
  # their z-scores mid-trial.
  selection_signal: arena_composite
  vol_lookback_days: 63

books:
  ENGINE_BASELINE_v1:
    purpose: arena-control-twin
    policy_version: 1
    selection: composite_top_k
    sizing: equal_weight
    screens: []
    llm_perception: false

  RISK_SIZED_v1:
    purpose: arena-isolate-inverse-vol-sizing
    policy_version: 1
    selection: composite_top_k
    sizing: inverse_trailing_vol    # weights ∝ 1 / trailing 63d stdev.
    # Transported finding: trailing vol beat the model on ALL FIVE spend
    # routes (Order 24). The estimator here is the CHEAP TRAILING one — the
    # receipt must never claim a model is why this works.
    screens: []
    llm_perception: false

  WINNER_EXEMPT_v1:
    purpose: arena-isolate-convexity-preservation
    policy_version: 1
    selection: composite_top_k
    sizing: equal_weight
    screens: []
    winner_exemption:               # CONVEXITY-PRESERVATION-1 (Holm-surviving)
      gain_threshold_pct: 40.0
      exempt_trading_days: 60
    llm_perception: false

  ANTI_SIGNAL_v1:
    purpose: arena-isolate-anti-chase-screens
    policy_version: 1
    selection: composite_top_k
    sizing: equal_weight
    screens:                        # both Holm-surviving anti-signals, 08-19
      - streak_up_5                 # exclude candidates on >=5 consecutive up closes
      - top_decile_ret21            # exclude last-month winner-chase leaders
    llm_perception: false

  LLM_PERCEPTION_v1:
    purpose: arena-isolate-llm-perception
    policy_version: 1
    selection: composite_top_k
    sizing: equal_weight
    screens: []
    llm_perception: true            # NOT a verified signal — measured here.
    llm:
      max_names_per_day: 10
      daily_call_cap: 25
      tilt_cap: 0.20                # |multiplicative tilt| <= 20%, deterministic
      tilt_scale: 2.0               # tilt = 1 + scale * (posterior - prior)
      horizon_days: 20
      observable: beats_benchmark
    # DAILY BELIEF REVIEW (beliefs.py), not a one-shot at rebalance. It runs on
    # EVERY session — holdings first, then challengers, then names whose score
    # moved — because thinking daily and trading daily are different things.
    # The PRIOR IS READ FROM THE LEDGER (the last posterior recorded for this
    # book x name); the model is shown it and forbidden to revise it, and is
    # asked only for the posterior. A first-ever look opens at the declared
    # OPENING_PRIOR and is stamped INITIATION — an opening LEVEL is not a
    # belief CHANGE and never tilts anything. A DETERMINISTIC mapper converts
    # belief_change into a bounded weight tilt at the next decision. The LLM
    # never sizes. Every review is minted as a gradeable PredictionRecord in
    # the arena's OWN ledger (never predictions.jsonl) and is resolved by the
    # daily pass itself.

  LLM_EVENTS_v1:
    purpose: arena-isolate-event-context      # the ABLATION twin
    policy_version: 1
    selection: composite_top_k
    sizing: equal_weight
    screens: []
    llm_perception: true
    event_context: true             # <- the ONLY difference from LLM_PERCEPTION_v1
    llm:
      max_names_per_day: 10
      daily_call_cap: 25
      tilt_cap: 0.20
      tilt_scale: 2.0
      horizon_days: 20
      observable: beats_benchmark
    # NUMERIC_ONLY vs NUMERIC_PLUS_EVENTS. LLM_PERCEPTION_v1 sees a numeric
    # snapshot; this book additionally sees the typed event feed (yfinance
    # news, EDGAR 8-K, earnings) that `event_intel.py` has produced for nobody
    # since it was built — its only caller, daily_brief.py, is not scheduled,
    # which is why live prod reports events_extracted: 0.
    # The context is FROZEN into each minted PredictionRecord's input_snapshot
    # (so the hash covers it) because the feed is fetched live and would
    # otherwise be unreplayable. Every belief row records `event_coverage`, so
    # the ablation is a filter on the ledger, not a reconstruction.

  CURRENT_BEST_v1:
    purpose: arena-composed-product-candidate
    policy_version: 1
    selection: composite_top_k
    sizing: inverse_trailing_vol
    screens: [streak_up_5, top_decile_ret21]
    winner_exemption:
      gain_threshold_pct: 40.0
      exempt_trading_days: 60
    llm_perception: true
    llm:
      max_names_per_day: 10
      daily_call_cap: 25
      tilt_cap: 0.20
      tilt_scale: 2.0
      horizon_days: 20
      observable: beats_benchmark
    substitution:                   # daily capital-substitution check
      margin_z: 0.5                 # candidate must beat weakest holding by this
      max_swaps_per_day: 1          # composite-score margin, net of round-trip cost

  # PERSONALITY PAIR (2026-08-21, Murat: "we can do sector focused, strategy
  # focused, very high risk, aggressive etc"). Concentration is the first
  # personality axis the engine can already express; each book differs from
  # ENGINE_BASELINE_v1 by that ONE axis via the whitelisted `overrides` block.
  # Costs, benchmark, gates stay file-level — the common world of the
  # factorial. Sector-focused books need a PIT sector source first (in the
  # 2026-08-21 handoff queue), and utility-personality GRADING (preservation /
  # balanced / aggressive / extreme growth) is a read on the ledger, not a
  # book: declared preferences are never tuned against history.

  AGGRESSIVE_TOP5_v1:
    purpose: arena-personality-aggressive-concentrated
    policy_version: 1
    selection: composite_top_k
    sizing: equal_weight
    screens: []
    llm_perception: false
    overrides:
      select_top_k: 5           # conviction-concentrated: 5 names
      max_single_name: 0.25     # 5 equal-weight names = 20%; the file cap of
                                # 15% would silently reshape the book, so the
                                # cap moves WITH the declared concentration

  DIVERSIFIED_TOP20_v1:
    purpose: arena-personality-diversified-wide
    policy_version: 1
    selection: composite_top_k
    sizing: equal_weight
    screens: []
    llm_perception: false
    overrides:
      select_top_k: 20          # breadth twin: same signal, 4x the names

  # CAPITAL ENGINE (2026-08-21, Order 26 adjudicated: "where is the profit
  # maximization?"). The first book whose mechanism is the ALLOCATION, not the
  # selection: fractional-Kelly weights from a declared edge mapping
  # (Grinold mu = IC*z*sigma, IC_PRIOR DECLARED never estimated), per-name
  # conviction that scales with edge/variance, and — first in the arena —
  # CASH: gross exposure rises and falls with conviction instead of being a
  # constant 1.0. It is also the first CONSUMER of RELIABILITY_ROUTER_v1:
  # until the matured ledger can vouch for the models (verdict RECOMMENDED),
  # the book runs at abstain_kelly_factor of its declared aggression. The
  # alpha input is the SAME composite every book sees — this experiment
  # cannot manufacture alpha; it measures whether the capital layer adds
  # wealth at fixed alpha, against ENGINE_BASELINE_v1.
  PROFIT_ALLOCATOR_v1:
    purpose: arena-capital-engine-ce-kelly
    policy_version: 1
    selection: composite_top_k
    sizing: ce_kelly
    screens: []
    llm_perception: false
    allocator:
      ic_prior: 0.05            # DECLARED: upper range of published momentum
                                # ICs; the receipt prints it on every decision
      kelly_fraction: 0.5       # half-Kelly at full trust
      abstain_kelly_factor: 0.5 # quarter-Kelly effective until the router
                                # can vouch (RECOMMENDED) — conservative by
                                # construction, not by mood
      max_gross: 1.0            # long-only, no leverage; cash is the residual

seeding:
  authorised: "Murat, 2026-08-20 (verbatim: 'this is your sandbox... lets start
    building the platform') — recorded in docs/ORDER_25_LIVE_ARENA_GEN1.md.
    Arena books are SIMULATION ledgers (class of lane_factory_sim /
    shadow_portfolios), not lanes; seed-a-lane governs real lanes only."
  script: python -m scripts.arena_run --seed
