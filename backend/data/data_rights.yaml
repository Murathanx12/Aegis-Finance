# ---------------------------------------------------------------------------
# DATA-RIGHTS REGISTER (M0, council 2 business item 3, 2026-11-15).
#
# Question this file answers: which data sources may legally reach a PUBLIC
# page? Before it existed nobody could say. `backend/services/data_rights.py`
# loads it; `python -m scripts.data_rights_audit --out <dir>` maps every public
# route to the sources it can serve and lists the ones that are `no`,
# UNVERIFIED or not listed here.
#
# RULES
#   * A flag is `yes`, `no` or `UNVERIFIED`. UNVERIFIED is the default and is
#     what a source stays until a PRIMARY terms page (read, not remembered)
#     says otherwise. A `yes` for public_display or commercial REQUIRES
#     `terms_url` + `date_read` + `basis`; the loader refuses a register
#     where that is missing.
#   * `no` means a primary page read on `date_read` restricts the use (or the
#     use needs a permission nobody has shown). It is not a legal opinion.
#   * `terms_read: failed` means the page was tried and could not be
#     retrieved (403/404/blocked); the flags stay UNVERIFIED.
#   * `owner_confirm: true` marks sources whose agreement only the owner can
#     know (HKU WRDS access, paid subscriptions, his brokerage account).
#   * `hosts` / `detect` drive the static audit. `detect.patterns` are
#     case-insensitive regexes over a function''s source; `hosts` are the
#     hostnames that, if found in traced code, belong to this source.
#   * This is a register of what the CODE uses, not legal advice. It does not
#     relax anything: UNVERIFIED must be read as "do not show publicly".
#
# `date_read` 2026-11-15 for every page below that was fetched.
# ---------------------------------------------------------------------------
