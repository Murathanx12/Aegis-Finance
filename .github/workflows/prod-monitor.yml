# Prod monitor + wake pinger.
# Railway runs SERVERLESS since 2026-08-04 (scale-to-zero): APScheduler dies
# while the app sleeps, so every scheduled job only fires if something wakes
# the app first. The scheduler's day (US/Eastern): 07:30 congress collect,
# Mon 09:00 aggressive check, 16:30 MTM + daily check, 17:30-19:30 MTM
# retries. The ping window must cover ALL of it: 11:00-23:59 UTC, every
# 10 min (inside Railway's sleep threshold), Mon-Fri.
# Also verifies /api/health/full (status + NAV freshness): failure opens a
# "PROD ALERT" issue (idempotent), recovery closes it. No silent outages,
# no silently-skipped collector jobs.

name: Prod monitor

on:
  schedule:
    - cron: "*/10 11-23 * * 1-5"   # every 10 min, 11:00-23:59 UTC, Mon-Fri
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping + health check
        id: health
        run: |
          set +e
          # wake ping (harmless when not sleeping; vital when sleeping)
          curl -s -o /dev/null --max-time 60 https://aegis-finance-production.up.railway.app/ || true
          body=$(curl -s --max-time 90 https://aegis-finance-production.up.railway.app/api/health/full)
          status=$(echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','missing'))" 2>/dev/null || echo "unparseable")
          fresh=$(echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('scheduler',{}).get('nav',{}).get('all_fresh','missing'))" 2>/dev/null || echo "unparseable")
          ledger=$(echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('prediction_ledger',{}).get('status','missing'))" 2>/dev/null || echo "unparseable")
          echo "status=$status fresh=$fresh ledger=$ledger"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "ledger=$ledger" >> "$GITHUB_OUTPUT"
          # prediction_ledger checked EXPLICITLY as well as via top-level
          # status: belt-and-suspenders, so a regression that re-hardcodes the
          # top-level "ok" cannot silence the ledger canary again.
          if [ "$status" = "ok" ] && [ "$ledger" = "ok" ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Manage alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTHY: ${{ steps.health.outputs.healthy }}
          STATUS: ${{ steps.health.outputs.status }}
          FRESH: ${{ steps.health.outputs.fresh }}
          LEDGER: ${{ steps.health.outputs.ledger }}
        run: |
          open_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --search "PROD ALERT in:title" \
            --json number --jq '.[0].number // empty')
          if [ "$HEALTHY" != "true" ]; then
            msg="Health check failed at $(date -u +'%F %T UTC'): status=\`$STATUS\`, nav all_fresh=\`$FRESH\`, prediction_ledger=\`$LEDGER\`. https://aegis-finance-production.up.railway.app/api/health/full"
            if [ -n "$open_issue" ]; then
              gh issue comment "$open_issue" --repo "$GITHUB_REPOSITORY" --body "$msg"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "PROD ALERT: health check failing" --body "$msg"
            fi
          elif [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$GITHUB_REPOSITORY" \
              --body "Recovered at $(date -u +'%F %T UTC') — status ok, nav all_fresh=$FRESH, prediction_ledger=$LEDGER."
            gh issue close "$open_issue" --repo "$GITHUB_REPOSITORY"
          fi
