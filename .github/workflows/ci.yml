name: CI

# Validated-real review item H3. Catches the regression class the external reviews
# flagged (dep-CVE drift, version drift, type errors) continuously and for free.
# Design choices (see docs/BACKLOG.md H3):
#   - pytest runs the FAST suite only: it is network-BLOCKED (backend/tests/conftest.py)
#     and per-test-timeout-guarded (pytest.ini), so CI is deterministic and offline.
#   - ruff + pip-audit start ADVISORY (continue-on-error) so the first runs aren't
#     red on pre-existing lint / unpinned-dep findings. Ratchet them to blocking
#     once clean.
#   - the slow (network, API-key) suite is intentionally NOT in CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only superseded runs of the SAME PR are cancelled. Main pushes stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify complete CI diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      receipts_only: ${{ steps.diff.outputs.receipts_only }}
      frontend_unaffected: ${{ steps.diff.outputs.frontend_unaffected }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
      need_backend: ${{ steps.diff.outputs.need_backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Bounded history: missing merge base/before SHA falls back to full CI.
          fetch-depth: ${{ github.event_name == 'pull_request' && 64 || 2 }}
      - name: Classifier regressions (stdlib only)
        run: python -m unittest discover -s tests/ci -v
      - name: Classify complete diff (unknown means full CI)
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci_diff_classifier.py

  backend:
    needs: changes
    # Classifier failures run full checks; skipped jobs still report checks.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.need_backend != 'false') }}
    name: backend (pytest offline + ruff + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pip-audit
          # Failed tests become GitHub annotations, which the PUBLIC API exposes
          # (check-runs/{id}/annotations). Job LOGS need a token; annotations
          # do not. Added 2026-09-07 after four red runs whose failing tests
          # could not be read from any session without a token.
          pip install pytest-github-actions-annotate-failures
      - name: Ruff (advisory)
        continue-on-error: true
        run: ruff check backend engine
      - name: pip-audit (advisory — surfaces real CVEs against resolved deps)
        continue-on-error: true
        run: pip-audit || true
      - name: Pytest (fast suite — offline, blocking)
        # This job checks out ONE repo, so the `Aegis module` sibling that holds
        # the frozen IIF-1 pre-registration is genuinely absent here. That is
        # declared rather than inferred: the loader prints a banner naming
        # everything left unverified, and the two consistency tests skip with a
        # reason instead of a bare "not present".
        #
        # This is safe because CI never accrues. The enforcement that matters
        # lives in `backend/services/iif1_prereg.verify_or_refuse()`, which the
        # nightly runner calls before constructing a real vendor call and which
        # deliberately IGNORES this variable — a context that cannot read the
        # pre-registration cannot spend money against it.
        env:
          AEGIS_IIF1_PREREG_ABSENT_OK: "1"
        # Beta replay checks process peak RSS against a 1.5 GiB safety cap.
        # A long shared pytest process can cross that cap in unrelated tests
        # before replay starts. Give replay its own fresh process, preserving
        # the production cap and running every offline test exactly once.
        run: |
          python -m pytest backend/tests/test_beta_v1_replay.py backend/tests/test_beta_v1_consumers.py -m "not slow" -q -rf -p pytest_github_actions_annotate_failures
          python -m pytest backend/tests/ -m "not slow" -q -rf -p pytest_github_actions_annotate_failures --ignore=backend/tests/test_beta_v1_replay.py --ignore=backend/tests/test_beta_v1_consumers.py

  frontend:
    needs: changes
    # Classifier failures run full checks; skipped jobs still report checks.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend_unaffected != 'true') }}
    name: frontend (next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Health alarm expiry regressions
        working-directory: frontend
        run: node --test tests/service-alarm.test.cjs
      - name: Build (catches type errors)
        working-directory: frontend
        run: npm run build
